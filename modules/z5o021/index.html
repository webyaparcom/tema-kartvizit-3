<style>
  /* galeri-deste — galeri-polaroid ve galeri-yigin kartları aynı anda yan yana/örtüşük gösterir, galeri-slayt ve galeri-film-serit sırayla kaydırır. Bu modül tek seferde TEK kartı öne alan fiziksel deste etkileşimidir: sürükle-bırak (pointer) ile atma, --s yığın konumuna bağlı öteleme/dönüş, dibe gönderme/geri alma ve üst kartı anlatan canlı yan panel. */
  .modulex-galeri-deste { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-galeri-deste *, .modulex-galeri-deste *::before, .modulex-galeri-deste *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-galeri-deste :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-galeri-deste :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-galeri-deste :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-galeri-deste :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-galeri-deste img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-galeri-deste) img { height: auto; }
  .modulex-galeri-deste [hidden] { display: none !important; }
  .modulex-galeri-deste :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-galeri-deste :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-galeri-deste-ic { max-width: --max--; margin-inline: auto; }
  .modulex-galeri-deste-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-galeri-deste--bassiz .modulex-galeri-deste-bas { display: none; }
  .modulex-galeri-deste-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-galeri-deste-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-galeri-deste-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-galeri-deste-bas { max-width: 760px; }
  .modulex-galeri-deste-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-galeri-deste-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-galeri-deste-dugme:hover { transform: translateY(-2px); }
  .modulex-galeri-deste-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-galeri-deste-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-galeri-deste-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-galeri-deste-duzen { display: grid; grid-template-columns: minmax(0, 1fr); align-items: center; gap: clamp(28px, 5vw, 80px); }
  .modulex-galeri-deste--djs .modulex-galeri-deste-duzen { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
  .modulex-galeri-deste-masa { overflow-x: clip; padding-block: 30px 36px; padding-inline: 8px 60px; }
  .modulex-galeri-deste-deste { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 290px); gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; padding-block-end: 8px; }
  .modulex-galeri-deste-kart { display: grid; align-content: start; gap: 12px; padding: 12px 12px 16px; border-radius: --yuvarlak--; background: --kartBg--; box-shadow: 0 26px 44px -30px color-mix(in srgb, --text-- 75%, transparent), 0 1px 3px color-mix(in srgb, --text-- 14%, transparent); scroll-snap-align: start; user-select: none; }
  .modulex-galeri-deste-kap { position: relative; aspect-ratio: 4 / 5; overflow: hidden; border-radius: calc(--yuvarlak-- * 0.6); background: color-mix(in srgb, --text-- 6%, --kartBg--); }
  .modulex-galeri-deste-kap .modulex-galeri-deste-g, .modulex-galeri-deste-kap .modulex-galeri-deste-yer { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
  .modulex-galeri-deste-rozet { position: absolute; inset-block-start: 12px; inset-inline-start: 12px; padding: 4px 12px; border-radius: 999px; background: --bg--; color: --text--; font-size: 0.75rem; font-weight: 700; }
  .modulex-galeri-deste-dalt { display: grid; gap: 4px; padding-inline: 4px; }
  .modulex-galeri-deste--djs .modulex-galeri-deste-dalt { display: none; }
  .modulex-galeri-deste--djs .modulex-galeri-deste-deste { grid-auto-flow: row; grid-auto-columns: auto; grid-template: minmax(0, 1fr) / minmax(0, 1fr); width: min(100%, 380px); margin-inline: auto; overflow: visible; padding: 0; touch-action: pan-y; }
  .modulex-galeri-deste--djs .modulex-galeri-deste-kart { --yx: 1; grid-area: 1 / 1; z-index: calc(60 - var(--s)); transform: translate(calc(var(--yx) * (var(--s) * 15px + var(--dx, 0) * 1px)), calc(var(--s) * -11px)) rotate(calc(var(--yx) * var(--s) * 3deg + var(--dx, 0) * 0.05deg)); transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1), opacity 0.35s ease; cursor: grab; }
  .modulex-galeri-deste--djs .modulex-galeri-deste-kart:dir(rtl) { --yx: -1; }
  .modulex-galeri-deste--djs .modulex-galeri-deste-kart.modulex-galeri-deste--derin { visibility: hidden; }
  .modulex-galeri-deste--djs .modulex-galeri-deste-kart.modulex-galeri-deste--surukle { transition: none; cursor: grabbing; }
  .modulex-galeri-deste--djs .modulex-galeri-deste-kart.modulex-galeri-deste--ucus { transform: translateX(calc(var(--yon, -1) * 150%)) rotate(calc(var(--yon, -1) * 18deg)); opacity: 0; }
  .modulex-galeri-deste-panel { display: grid; align-content: center; gap: 14px; }
  .modulex-galeri-deste:not(.modulex-galeri-deste--djs) .modulex-galeri-deste-panel { display: none; }
  .modulex-galeri-deste-sayac { display: flex; align-items: baseline; font-variant-numeric: tabular-nums; }
  .modulex-galeri-deste-simdi { color: --accentInk--; font-family: var(--mx-font-heading, inherit); font-size: clamp(3.4rem, 7vw, 5.6rem); font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
  .modulex-galeri-deste-toplam { color: --muted--; font-size: 1.15rem; font-weight: 700; }
  .modulex-galeri-deste-pkat { color: --accentInk--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-galeri-deste-pbas { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.45rem, 2.6vw, 2.2rem); font-weight: 750; line-height: 1.15; }
  .modulex-galeri-deste-pmet { max-width: 44ch; color: --muted--; font-size: 1rem; line-height: 1.65; }
  .modulex-galeri-deste-dugmeler { display: flex; gap: 12px; margin-block-start: 10px; }
  .modulex-galeri-deste-dugmeler .modulex-galeri-deste-ok { width: 58px; height: 58px; }
  .modulex-galeri-deste-dugmeler .modulex-galeri-deste-ok:last-child { background: --text--; border-color: --text--; color: --bg--; }
  .modulex-galeri-deste-dugmeler .modulex-galeri-deste-ok:last-child:hover { background: --accent--; border-color: --accent--; color: --accentText--; }
  @media (max-width: 768px) {
    .modulex-galeri-deste--djs .modulex-galeri-deste-duzen { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .modulex-galeri-deste-masa { padding-block: 26px 24px; padding-inline: 4px 48px; }
    .modulex-galeri-deste--djs .modulex-galeri-deste-deste { width: min(100%, 270px); }
    .modulex-galeri-deste-deste { grid-auto-columns: 74%; }
    .modulex-galeri-deste-panel { justify-items: center; text-align: center; }
    .modulex-galeri-deste-simdi { font-size: 2.8rem; }
  }
  .modulex-galeri-deste-yer { display: grid; place-items: center; width: 100%; aspect-ratio: 4 / 3; background: color-mix(in srgb, --accent-- 14%, --kartBg--); color: --accentInk--; }
  .modulex-galeri-deste-yer .material-symbols-outlined { font-size: 40px; }
  .modulex-galeri-deste-bag { color: inherit; text-decoration: none; }
  .modulex-galeri-deste-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-galeri-deste-kbaslik { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
  .modulex-galeri-deste-kmetin { color: --muted--; font-size: 0.95rem; line-height: 1.6; }
  .modulex-galeri-deste-kat { color: --accentInk--; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-galeri-deste-kontrol { display: flex; gap: 10px; justify-content: flex-end; margin-block-start: 18px; }
  .modulex-galeri-deste-ok { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid --cizgi--; border-radius: 50%; background: --kartBg--; color: --text--; transition: background 0.25s ease, color 0.25s ease, opacity 0.25s ease; }
  .modulex-galeri-deste-ok:hover:not(:disabled) { background: --accent--; color: --accentText--; }
  .modulex-galeri-deste-ok:disabled { opacity: 0.4; cursor: default; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-galeri-deste :is(.modulex-galeri-deste-baslik, .modulex-galeri-deste-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-galeri-deste-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-galeri-deste { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-galeri-deste *, .modulex-galeri-deste *::before, .modulex-galeri-deste *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-galeri-deste";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const deste = (s, P, az) => {
        const D = s.querySelector("[data-dk-deste]");
        if (!D) return;
        const K = [...D.querySelectorAll("[data-dk]")];
        if (K.length < 2) return;
        s.classList.add(P + "--djs");
        const al = (q) => s.querySelector(q);
        const say = al("[data-dk-say]");
        const kat = al("[data-dk-kat]");
        const bas = al("[data-dk-bas]");
        const met = al("[data-dk-met]");
        const sira = K.slice();
        let mesgul = false;
        const rtl = () => getComputedStyle(s).direction === "rtl";
        const yerlestir = () => {
          sira.forEach((k, j) => {
            k.style.setProperty("--s", String(j));
            k.classList.toggle(P + "--derin", j > 3);
            k.setAttribute("aria-hidden", String(j > 0));
            k.inert = j > 0;
          });
          const u = sira[0];
          if (say) say.textContent = String(K.indexOf(u) + 1).padStart(2, "0");
          if (kat) { kat.textContent = u.dataset.kat || ""; kat.hidden = !u.dataset.kat; }
          if (bas) bas.textContent = u.dataset.baslik || "";
          if (met) { met.textContent = u.dataset.metin || ""; met.hidden = !u.dataset.metin; }
        };
        const git = (d, yon) => {
          if (mesgul) return;
          if (d < 0) { sira.unshift(sira.pop()); yerlestir(); return; }
          const u = sira[0];
          mesgul = true;
          u.style.setProperty("--yon", String(yon || (rtl() ? 1 : -1)));
          u.classList.add(P + "--ucus");
          setTimeout(() => {
            u.classList.remove(P + "--ucus");
            u.style.removeProperty("--dx");
            sira.push(sira.shift());
            yerlestir();
            mesgul = false;
          }, az ? 0 : 340);
        };
        let x0 = null;
        let dx = 0;
        D.addEventListener("pointerdown", (e) => {
          if (mesgul || e.button > 0 || !sira[0].contains(e.target) || e.target.closest("a")) return;
          x0 = e.clientX;
          dx = 0;
          sira[0].classList.add(P + "--surukle");
        });
        D.addEventListener("pointermove", (e) => {
          if (x0 === null) return;
          dx = e.clientX - x0;
          sira[0].style.setProperty("--dx", String(Math.round(dx)));
        });
        const birak = () => {
          if (x0 === null) return;
          x0 = null;
          const u = sira[0];
          u.classList.remove(P + "--surukle");
          if (Math.abs(dx) > 70) git(1, dx < 0 ? -1 : 1);
          else u.style.removeProperty("--dx");
          dx = 0;
        };
        D.addEventListener("pointerup", birak);
        D.addEventListener("pointercancel", birak);
        D.addEventListener("pointerleave", birak);
        s.querySelectorAll("[data-dk-git]").forEach((b) => b.addEventListener("click", () => git(Number(b.dataset.dkGit))));
        s.addEventListener("keydown", (e) => {
          if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
          e.preventDefault();
          git((e.key === "ArrowRight") !== rtl() ? 1 : -1);
        });
        yerlestir();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      deste(s, P, az);
    });
  })();
</script>
